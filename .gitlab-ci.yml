stages:
  - test

api-tests:
  stage: test
  image: python:3.12-slim
  # Tests hit the live API of one Adapty app: never run two pipelines at once
  # to avoid sharing rate limits and data with a concurrent run.
  resource_group: adapty-api
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip
    paths:
      - .cache/pip
  before_script:
    - test -n "$ADAPTY_SECRET_API_KEY" || (echo "Set ADAPTY_SECRET_API_KEY in Settings > CI/CD > Variables" && exit 1)
    - pip install -r requirements.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - report.xml
    reports:
      junit: report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
